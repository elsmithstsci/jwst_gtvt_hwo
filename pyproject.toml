[project]
name = "hwo_gtvt"
description = "HWO General and Moving Target Visibility Tool"
readme = "README.md"
authors = [
  { name = "Mees Fix" },
  { name = "Bryan Holler" },
  { name = "Matthew Hill" },
]
keywords = ["astronomy", "python"]
classifiers = ["Programming Language :: Python"]
requires-python = ">=3.10"
dependencies = [
    "astropy>=5.2.2",
    "astroquery>=0.4.6",
    "bokeh>=3.8.0",
    "docopt>=0.6.2",
    "matplotlib>=3.7.1",
    "numpy>=1.24.3",
    "pysiaf>=0.19.0",
    "pandas>=2.0.1",
    "docopt>=0.6.2",
    "tabulate>=0.9.0",
]

dynamic = ["version"]

[project.optional-dependencies]
test = [
  "pytest",
  "pytest-cov",
]  
docs = [
  "sphinx",
  "sphinx_rtd_theme",
  "stsci_rtd_theme",
]

[project.license]
file = "LICENSE"
content-type = "text/plain"

[build-system]
requires = ["setuptools >= 61.2",
            "setuptools_scm[toml]>=7.1"]
build-backend = 'setuptools.build_meta'

[project.scripts]
hwo_gtvt = "hwo_gtvt.scripts.hwo_gtvt:driver"
hwo_mtvt = "hwo_gtvt.scripts.hwo_mtvt:driver"
delete_cache = "hwo_gtvt.scripts.delete_cache:driver"
create_ephemeris = "hwo_gtvt.scripts.create_new_ephemeris:driver"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
namespaces = false

[tool.setuptools_scm]

[tool.pytest]
junit_family = "xunit2"
